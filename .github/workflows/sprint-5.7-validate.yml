name: Production validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, sprint-5.7-factory-billing]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: git diff --check HEAD^ HEAD
      - run: npm run verify:parts-closeout
      - run: npm run verify:ics-all-day
      - run: npm run verify:factory-billing
      - run: npm run typecheck
      - run: npm run verify:work-order-extraction
      - run: npm run verify:job-save-feedback
      - run: npm run verify:job-cover
      - run: npm run verify:privacy-export
      - run: npm run build
      - run: npm run verify:production-boundaries
