name: Sprint 5.7 validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [sprint-5.7-factory-billing]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify:factory-billing
      - run: npm run typecheck
      - run: npm run build
