name: Sprint 5.6 Validation

on:
  push:
    branches:
      - sprint-5.6-production-settings-fallback
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate settings fallback
        run: npm run verify:settings-fallback

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
